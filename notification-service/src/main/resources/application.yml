server:
  port: 8085

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/fooddelivery
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the only thing that creates/alters tables; Hibernate just validates the
      # JPA entity mappings against what Flyway has already created.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification_service
        format_sql: false

  flyway:
    schemas: notification_service
    default-schema: notification_service
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    # Consumer-side deserializer, group-id, and error-handling wiring is defined
    # explicitly in KafkaConsumerConfig (needs ErrorHandlingDeserializer + a custom
    # ConcurrentKafkaListenerContainerFactory, which Boot's property-only autoconfig
    # cannot express) — that bean takes precedence over any spring.kafka.consumer.*
    # properties, so only bootstrap-servers is set here.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Notifications endpoint tuning
notification:
  max-list-size: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: notification-service
    version: 1.0.0
    description: "Fan-in consumer of all 4 topics — persists notifications, broadcasts global SSE activity feed"
    port: 8085

logging:
  level:
    com.fooddelivery.notification: INFO
