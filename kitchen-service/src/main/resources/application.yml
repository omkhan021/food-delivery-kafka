server:
  port: 8083

spring:
  application:
    name: kitchen-service

  datasource:
    url: jdbc:postgresql://localhost:5432/fooddelivery
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}

  jpa:
    hibernate:
      # Flyway is the ONLY thing that creates/alters tables. Hibernate only validates
      # the entity mappings against what Flyway has already created.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: kitchen_service

  flyway:
    schemas: kitchen_service
    create-schemas: true
    default-schema: kitchen_service
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: kitchen-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer wraps the real JSON deserializer so that a poison /
      # malformed record can't crash the consumer thread - it is handed to the
      # container's error handler instead of blowing up deserialization inline.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.fooddelivery.kitchen.dto"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.fooddelivery.kitchen.dto.PaymentEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# Kitchen prep simulation timing. Values are demo-friendly (seconds, not real
# minutes) so a full saga completes quickly during a live demo.
kitchen:
  prep-start-delay-ms: 2000
  prep-duration-ms: 5000
  min-prep-minutes: 10
  max-prep-minutes: 25

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    allowed-origin: http://localhost:5173

logging:
  level:
    com.fooddelivery.kitchen: INFO
