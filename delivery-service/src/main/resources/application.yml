server:
  port: 8084

spring:
  application:
    name: delivery-service

  datasource:
    url: jdbc:postgresql://localhost:5432/fooddelivery
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates entity mappings against it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: delivery_service
        format_sql: true

  flyway:
    schemas: delivery_service
    default-schema: delivery_service
    create-schemas: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: delivery-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapped in ErrorHandlingDeserializer so a malformed/poison-pill payload on the topic
      # becomes a DeserializationException handled by the container's error handler instead of
      # crashing the listener thread. See KafkaConsumerConfig for the CommonErrorHandler bean.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.fooddelivery.delivery.dto"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.fooddelivery.delivery.dto.KitchenEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: delivery-service
    version: 1.0.0
    description: "Driver & delivery simulation — processes ORDER_PREPARED, emits DRIVER_ASSIGNED / PICKED_UP / ENROUTE / DELIVERED"
    port: 8084

# Demo-friendly delay configuration for the delivery state machine.
# Kept short (a few seconds) so the end-to-end saga is visible in the UI quickly.
delivery:
  pickup-delay-ms: 3000
  enroute-delay-ms: 3000
  delivered-delay-ms: 5000
  min-eta-minutes: 15
  max-eta-minutes: 35

cors:
  allowed-origin: http://localhost:5173

logging:
  level:
    com.fooddelivery.delivery: INFO
