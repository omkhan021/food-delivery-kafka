server:
  port: 8082

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/fooddelivery
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}

  flyway:
    schemas: payment_service
    default-schema: payment_service
    create-schemas: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: payment_service
        format_sql: true
    show-sql: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer wraps the real (JsonDeserializer) delegate so that a poison-pill
      # message (malformed JSON, unexpected shape, etc.) becomes a DeserializationException that
      # Spring Kafka's error-handling machinery can catch and route to the recoverer configured in
      # KafkaConsumerConfig, instead of killing the listener container. See that class for details.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.fooddelivery.payment.event
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.fooddelivery.payment.event.OrderEvent

# Dummy payment gateway simulation settings (see PaymentService for how these are used).
payment:
  # Delay, in milliseconds, between publishing PAYMENT_PROCESSING and deciding/publishing the
  # final outcome (PAYMENT_COMPLETED or PAYMENT_FAILED). Simulates a real payment gateway's
  # network round-trip / processing time.
  processing-delay-ms: 3000
  # Probability (0.0 - 1.0) that a simulated payment fails. Default 0.15 = 15%.
  failure-rate: 0.15

cors:
  allowed-origin: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: payment-service
    version: 1.0.0
    description: "Dummy payment gateway simulation — processes ORDER_PLACED events, emits PAYMENT_COMPLETED or PAYMENT_FAILED"
    port: 8082

logging:
  level:
    com.fooddelivery.payment: INFO
